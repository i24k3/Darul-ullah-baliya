<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darul Uloom Bilaliya</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic + Latin fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    .font-arabic { font-family: 'Amiri', 'Cairo', 'Noto Naskh Arabic', serif; }
    .font-latin { font-family: 'Cairo', system-ui, sans-serif; }

    html, body { overflow-y: scroll; scrollbar-width: none; }
    body::-webkit-scrollbar { display: none; }

    .fade-in-section { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .fade-in-section.visible { opacity: 1; transform: translateY(0); }

    #root { opacity: 0; transition: opacity 0.8s ease-out; }
    #root.visible { opacity: 1; }
  </style>
</head>

<body class="font-arabic bg-gray-50 min-h-screen">
  <!-- SPA mount point -->
  <div id="root"></div>

  <!-- Media Popup -->
  <div id="media-popup" class="hidden fixed inset-0 bg-black/70 z-[9999] items-center justify-center p-6">
    <div class="relative bg-white rounded-xl max-w-4xl w-full h-[80vh] shadow-xl overflow-hidden">

      <!-- Close button -->
      <button id="media-popup-close" class="absolute top-4 right-4 text-gray-700 hover:text-gray-900 text-2xl font-bold z-10">
        &times;
      </button>

      <!-- Dynamic content -->
      <div id="media-popup-content" class="w-full h-full flex items-center justify-center"></div>
    </div>
  </div>

  <!-- Media popup script -->
  <script>
function openMediaPopup(url, type = "video") {
    const popup = document.getElementById("media-popup");
    const content = document.getElementById("media-popup-content");

    let embedHTML = "";
    let popupHeight = "80vh"; // default for video

    if (type === "video") {
        // Extract YouTube ID
        let id = url.includes("youtu.be")
            ? url.split("youtu.be/")[1].split("?")[0]
            : url.includes("v=")
                ? url.split("v=")[1].split("&")[0]
                : url;
        embedHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" class="w-full h-full" allowfullscreen></iframe>`;
    } else if (type === "audio") {
        embedHTML = `<audio controls autoplay class="w-full h-20 p-4"><source src="${url}" type="audio/mpeg">Your browser does not support audio.</audio>`;
        popupHeight = "10rem"; // compact height for audio
    }

    content.innerHTML = embedHTML;
    const popupCard = popup.querySelector("div.relative");
    popupCard.style.height = popupHeight; // adjust popup height
    popup.classList.remove("hidden");
    popup.classList.add("flex");
}

    document.getElementById("media-popup-close").addEventListener("click", () => {
      const popup = document.getElementById("media-popup");
      document.getElementById("media-popup-content").innerHTML = "";
      popup.classList.add("hidden");
      popup.classList.remove("flex");
    });

    // Close when clicking outside
    document.getElementById("media-popup").addEventListener("click", (e) => {
      if (e.target.id === "media-popup") {
        document.getElementById("media-popup-content").innerHTML = "";
        e.currentTarget.classList.add("hidden");
        e.currentTarget.classList.remove("flex");
      }
    });

    // Delegated listener for dynamically generated buttons
    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("popup-btn")) {
        openMediaPopup(e.target.dataset.url, e.target.dataset.type);
      }
    });
  </script>

  <!-- SPA script -->
  <script type="module" src="./app.js"></script>

  <noscript>
    <div class="fixed inset-0 bg-red-600 text-white flex items-center justify-center text-center p-8 z-50">
      <div>
        <h1 class="text-4xl font-bold mb-4">JavaScript is Disabled</h1>
        <p>Please enable JavaScript to view Darul Uloom Bilaliya website properly.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
