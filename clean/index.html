<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Darul Uloom Bilaliya</title>

        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Beautiful Arabic + Latin fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

        <style>
        .font-arabic {
            font-family: 'Amiri', 'Cairo', 'Noto Naskh Arabic', serif;
        }
        .font-latin {
            font-family: 'Cairo', system-ui, sans-serif;
        }

        html {
            overflow-y: scroll;           
            scrollbar-width: none;        
        }
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* Smooth fade-in for page loader */
        #page-loader {
            transition: opacity 0.8s ease-out;
        }
        </style>
    </head>

    <body class="font-arabic bg-gray-50 min-h-screen">

        <!-- Main App Root -->
        <div id="root"></div>

        <!-- ==================== SCRIPTS ==================== -->
        <script type="module">
        import { showPageLoader } from "./components/loading.js";
        import { initRouter } from "./utils.js";

        // 1. Show Bismillah loader immediately
        showPageLoader();

        // 2. Wait for DOM + fonts + minimal delay, then boot the app
        window.addEventListener('DOMContentLoaded', () => {
            // Small extra delay to ensure the loader feels intentional (Islamic vibe)
            setTimeout(() => {
                // Hide loader smoothly
                if (window.hidePageLoader) {
                    window.hidePageLoader();
                }

                // Now start routing & render first page
                initRouter();
            }, 1200); // You can increase to 1200–1500ms for more dramatic effect
        });
        </script>

        <!-- Your main app (pages, components, etc.) -->
        <script type="module" src="./app.js"></script>

        <!-- Optional: Fallback if something goes wrong -->
        <noscript>
            <div class="fixed inset-0 bg-red-600 text-white flex items-center justify-center text-center p-8 z-50">
                <div>
                    <h1 class="text-4xl font-bold mb-4">JavaScript is Disabled</h1>
                    <p>Please enable JavaScript to view Darul Uloom Bilaliya website properly.</p>
                </div>
            </div>
        </noscript>
    </body>
</html>
